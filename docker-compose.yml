services:
  helpdesk:
    build:
      context: .
      dockerfile: services/helpdesk/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TICKET_REFERENCE_CSV: "/app/reference/ticketreference examples.csv"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./reference:/app/reference:ro
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: services/portal/Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      HELPDESK_URL: http://helpdesk:8000
      PORTAL_URL: http://portal:8001
      DOCS_ROOT: /app/docs
      AGENT_DB: /app/data/agent.db
      AGENT_POLL_INTERVAL: "5"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs:ro
    depends_on:
      - helpdesk
      - portal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8003:80"
    depends_on:
      - helpdesk
      - portal
      - agent
    restart: unless-stopped
