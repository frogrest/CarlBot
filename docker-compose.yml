services:
  helpdesk:
    build:
      context: .
      dockerfile: services/helpdesk/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TICKET_REFERENCE_CSV: "/app/reference/ticketreference examples.csv"
      DOCS_ROOT: "/app/docs"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-1}
      LOCAL_LLM_MODEL_PATH: ${LOCAL_LLM_MODEL_PATH:-}
      LOCAL_LLM_SERVER_BIN: ${LOCAL_LLM_SERVER_BIN:-}
      LOCAL_LLM_MODELS_DIR: /app/data/models
      LOCAL_LLM_N_CTX: ${LOCAL_LLM_N_CTX:-4096}
      LOCAL_LLM_MAX_OUTPUT_TOKENS: ${LOCAL_LLM_MAX_OUTPUT_TOKENS:-512}
      LOCAL_LLM_HOST: ${LOCAL_LLM_HOST:-127.0.0.1}
      LOCAL_LLM_PORT: ${LOCAL_LLM_PORT:-8080}
      LOCAL_LLM_N_THREADS: ${LOCAL_LLM_N_THREADS:-0}
      LOCAL_LLM_STARTUP_TIMEOUT: ${LOCAL_LLM_STARTUP_TIMEOUT:-180}
      LOCAL_LLM_GENERATION_TIMEOUT: ${LOCAL_LLM_GENERATION_TIMEOUT:-120}
    volumes:
      - ./data:/app/data
      - ./reference:/app/reference:ro
      - ./docs:/app/docs:ro
      - ./prompts:/app/prompts:ro
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: services/portal/Dockerfile
    ports:
      - "8001:8001"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      HELPDESK_URL: http://helpdesk:8000
      PORTAL_URL: http://portal:8001
      DOCS_ROOT: /app/docs
      AGENT_DB: /app/data/agent.db
      AGENT_POLL_INTERVAL: "5"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-1}
      LOCAL_LLM_MODEL_PATH: ${LOCAL_LLM_MODEL_PATH:-}
      LOCAL_LLM_SERVER_BIN: ${LOCAL_LLM_SERVER_BIN:-}
      LOCAL_LLM_MODELS_DIR: /app/data/models
      LOCAL_LLM_N_CTX: ${LOCAL_LLM_N_CTX:-4096}
      LOCAL_LLM_MAX_OUTPUT_TOKENS: ${LOCAL_LLM_MAX_OUTPUT_TOKENS:-512}
      LOCAL_LLM_HOST: ${LOCAL_LLM_HOST:-127.0.0.1}
      LOCAL_LLM_PORT: ${LOCAL_LLM_PORT:-8080}
      LOCAL_LLM_N_THREADS: ${LOCAL_LLM_N_THREADS:-0}
      LOCAL_LLM_STARTUP_TIMEOUT: ${LOCAL_LLM_STARTUP_TIMEOUT:-180}
      LOCAL_LLM_GENERATION_TIMEOUT: ${LOCAL_LLM_GENERATION_TIMEOUT:-120}
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs:ro
    depends_on:
      - helpdesk
      - portal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8003:80"
    depends_on:
      - helpdesk
      - portal
      - agent
    restart: unless-stopped
