services:
  helpdesk:
    build: .
    command: uvicorn services.helpdesk.app:app --host 0.0.0.0 --port 8001
    environment: [PYTHONPATH=/app]
    ports: ["8001:8001"]
    volumes: ["./data:/app/data"]
  portal:
    build: .
    command: uvicorn services.portal.app:app --host 0.0.0.0 --port 8002
    environment: [PYTHONPATH=/app]
    ports: ["8002:8002"]
    volumes: ["./data:/app/data"]
  agent:
    build: .
    command: python -m services.agent.agent
    environment:
      PYTHONPATH: /app
      HELPDESK_URL: http://helpdesk:8001
      PORTAL_URL: http://portal:8002
      AGENT_POLL_SECONDS: "2"
    depends_on: [helpdesk, portal]
    volumes: ["./data:/app/data"]
  agent-api:
    build: .
    command: uvicorn services.agent.app:app --host 0.0.0.0 --port 8003
    environment:
      PYTHONPATH: /app
      HELPDESK_URL: http://helpdesk:8001
      PORTAL_URL: http://portal:8002
    ports: ["8003:8003"]
    depends_on: [helpdesk, portal]
    volumes: ["./data:/app/data"]
