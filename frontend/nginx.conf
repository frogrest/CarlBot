resolver 127.0.0.11 valid=10s ipv6=off;

upstream helpdesk_backend {
    zone helpdesk_backend 64k;
    server helpdesk:8000 resolve;
}

upstream portal_backend {
    zone portal_backend 64k;
    server portal:8001 resolve;
}

upstream agent_backend {
    zone agent_backend 64k;
    server agent:8002 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /helpdesk/ {
        proxy_pass http://helpdesk_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/ {
        proxy_pass http://portal_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agent/ {
        proxy_pass http://agent_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
